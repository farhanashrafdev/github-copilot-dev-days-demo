name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes an in-flight run. Keeps the checks on a pull request
# from queueing up behind each other during a live demo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # `npm install` rather than `npm ci`: the lockfile is generated on Windows
        # and Tailwind v4's optional wasm fallback packages do not resolve
        # identically on Linux. `npm ci` refuses; `npm install` reconciles and is
        # still fast because the npm cache is restored above.
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
